server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: faaps-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/faaps?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:faaps}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
faaps:
  frontend-url: ${FAAPS_FRONTEND_URL:http://localhost:5173}
springdoc:
  swagger-ui:
    csrf:
      enabled: true
