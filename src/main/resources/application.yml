server:
  port: 8080
  servlet:
    session:
      timeout: ${FAAPS_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${FAAPS_AUTH_COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: faaps-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/faaps?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:faaps}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
faaps:
  frontend-url: ${FAAPS_FRONTEND_URL:http://localhost:5173}
  ai:
    gemini-api-key: ${FAAPS_GEMINI_API_KEY:}
  auth:
    refresh-token-lifetime: ${FAAPS_REFRESH_TOKEN_LIFETIME:14d}
    cookie-secure: ${FAAPS_AUTH_COOKIE_SECURE:false}
springdoc:
  swagger-ui:
    csrf:
      enabled: true
