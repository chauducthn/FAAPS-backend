name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST || '56.10.8.193' }}
          username: ${{ vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "=== Pulling latest changes from Git ==="
            cd /home/ubuntu/FAAPS-backend
            git pull origin main

            echo "=== Building application with Maven ==="
            mvn clean package -DskipTests

            echo "=== Restarting Spring Boot Service ==="
            sudo systemctl restart faaps-backend.service

            echo "=== Checking Service Status ==="
            sudo systemctl is-active --quiet faaps-backend.service && echo "Backend is ACTIVE!" || (sudo journalctl -u faaps-backend.service -n 30 --no-pager && exit 1)
            for attempt in $(seq 1 30); do
              if curl -fs -o /dev/null --max-time 3 http://localhost:8080/api/health; then
                echo "Health check PASSED!"
                exit 0
              fi
              sleep 2
            done
            sudo journalctl -u faaps-backend.service -n 30 --no-pager
            exit 1
